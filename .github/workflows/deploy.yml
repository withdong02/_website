name: Deploy website

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: papercraft-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install Hugo
        env:
          HUGO_VERSION: 0.161.1
        run: |
          curl --fail --silent --show-error --location --retry 3 -o "$RUNNER_TEMP/hugo.tar.gz" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir -p "$RUNNER_TEMP/hugo-bin"
          tar -xzf "$RUNNER_TEMP/hugo.tar.gz" -C "$RUNNER_TEMP/hugo-bin" hugo
          echo "$RUNNER_TEMP/hugo-bin" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm run check
      - run: python3 tests/deploy-site-check.py
      - run: npm run lint
      - run: npm run build
      - name: Deploy current main
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          latest="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo "A newer main commit exists; skip this outdated deployment."
            exit 0
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/website_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/website_deploy ~/.ssh/known_hosts
          ssh -T -i ~/.ssh/website_deploy -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            ubuntu@124.221.38.221 manifest > .tmp/current-manifest.json
          python3 scripts/deploy-site.py pack .tmp/current-manifest.json
          ssh -T -i ~/.ssh/website_deploy -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@124.221.38.221 "deploy $GITHUB_SHA $GITHUB_RUN_ID $GITHUB_RUN_ATTEMPT" < .tmp/site.tar.gz
      - name: Verify public site
        run: |
          for route in / /posts/ /tags/ /categories/ /archives/; do
            curl --fail --silent --show-error --retry 3 --max-time 30 "https://blog.withdong02.top$route" -o /dev/null
          done
